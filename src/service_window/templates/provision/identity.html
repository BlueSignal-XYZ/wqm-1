{% extends "base.html" %}
{% block title %}Device Identity{% endblock %}
{% block content %}
<h1>Device Identity</h1>

<div class="identity-card">
    <table>
        <tr><th>Device ID</th><td>{{ identity.device_id }}</td></tr>
        <tr><th>DevEUI</th><td>{{ identity.dev_eui }}</td></tr>
        <tr><th>BLE Name</th><td>{{ identity.ble_name }}</td></tr>
    </table>

    <h2>QR Code</h2>
    <img src="{{ url_for('provision.qr_svg') }}" alt="Device QR Code" class="qr-code">
    <p><a href="{{ url_for('provision.qr_svg') }}" download="wqm1-qr.svg">Download SVG</a></p>
</div>

<a href="{{ url_for('provision.index') }}">&larr; Back to Provisioning</a>
{% endblock %}
