[project]
name = "bluesignal-wqm1"
version = "2.1.1"
description = "BlueSignal WQM-1 Water Quality Monitor — open-source firmware"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B104", "B110", "B404", "B413", "B603", "B607"]

[tool.coverage.run]
source = ["src"]
omit = [
    # main.py is thin wiring since v2 — the orchestration logic it used to
    # hold lives in src/app/ (fully covered). Hardware-bound modules stay
    # omitted; process entry points have no measurable logic.
    "src/main.py",
    "src/control/led.py",
    "src/radio/sx1262.py",
    "src/radio/lorawan.py",
    "src/sensors/temperature.py",
    "src/utils/watchdog.py",
    "src/service_window/__main__.py",
    "src/ota/__main__.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: marks tests that require physical hardware (I2C, GPIO, SPI)",
]
