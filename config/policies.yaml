# ---------------------------------------------------------------
# WQM-1 Relay Automation Policies
# ---------------------------------------------------------------
# This file configures safety limits and schedule windows for the
# rules engine, plus a default set of water quality automation rules.
#
# Loaded by the firmware at startup from:
#   /opt/bluesignal/config/policies.yaml
#
# Rules format:
#   sensor:      ph | tds_ppm | turbidity_ntu | orp_mv | temp_c
#   operator:    > | < | >= | <= | ==
#   threshold:   numeric trigger value
#   relay:       1-4 (which relay channel to control)
#   action:      on | off
#   duration_s:  auto-shutoff after N seconds (0 = stay until cleared)
# ---------------------------------------------------------------

# --- Safety limits ---
limits:
  max_on_minutes_per_hour: 10    # Max cumulative relay ON time per hour
  cooldown_seconds: 120          # Min seconds between relay OFF → ON
  max_temp_c: 50.0               # Reference limit (informational)

# --- Schedule window ---
# Rules only fire within this time window. Outside = relays stay off.
schedule:
  enabled: true
  start: "07:00"
  end: "21:00"

# --- Manual override ---
# When true, the rules engine evaluates nothing and never actuates a relay;
# all relays are forced OFF at startup. This is the safe default so a freshly
# provisioned, monitoring-only unit never drives a pump, valve, or aerator.
#
# Leave this true until you have (1) wired and assigned the relay channels below
# for YOUR installation and (2) confirmed every sensor that drives a rule is
# seated and reading in range. A disconnected/dry probe pins its reading at a
# rail (e.g. turbidity at full scale, TDS near 0) and, with automation enabled,
# will hold a relay on until it hits the per-hour on-time cap, then re-engage at
# the top of the next hour — an audible relay "click" every hour on the hour.
# Set to false to enable automation once the install is verified.
manual:
  override: true

# ---------------------------------------------------------------
# Automation Rules  (EXAMPLES — inert until manual.override is set to false)
# ---------------------------------------------------------------
# These thresholds and relay assignments are illustrative defaults. They do
# nothing while manual.override is true (the shipped default). Review and adapt
# them to your installation before enabling automation.
#
# Relay assignments (customise for your installation):
#   Relay 1 — Acid dosing pump (lower pH)
#   Relay 2 — Base / alkalinity dosing pump (raise pH)
#   Relay 3 — Aerator / air pump (raise ORP / dissolved oxygen)
#   Relay 4 — Circulation pump / flush valve
# ---------------------------------------------------------------

rules:

  # =================================================================
  # Relay 1 — Acid dosing pump
  # =================================================================

  # High pH: dose acid for 30 seconds
  - sensor: ph
    operator: ">"
    threshold: 8.5
    relay: 1
    action: "on"
    duration_s: 30

  # pH back in safe range: stop dosing
  - sensor: ph
    operator: "<="
    threshold: 7.5
    relay: 1
    action: "off"
    duration_s: 0

  # =================================================================
  # Relay 2 — Base / alkalinity dosing pump
  # =================================================================

  # Low pH: dose base for 30 seconds
  - sensor: ph
    operator: "<"
    threshold: 6.0
    relay: 2
    action: "on"
    duration_s: 30

  # pH recovered: stop dosing
  - sensor: ph
    operator: ">="
    threshold: 6.8
    relay: 2
    action: "off"
    duration_s: 0

  # =================================================================
  # Relay 3 — Aerator / air pump
  # =================================================================

  # Low ORP (poor oxidation): turn on aerator
  - sensor: orp_mv
    operator: "<"
    threshold: 200.0
    relay: 3
    action: "on"
    duration_s: 0

  # ORP recovered: turn off aerator
  - sensor: orp_mv
    operator: ">="
    threshold: 300.0
    relay: 3
    action: "off"
    duration_s: 0

  # High turbidity: aerate to assist settling
  - sensor: turbidity_ntu
    operator: ">"
    threshold: 500.0
    relay: 3
    action: "on"
    duration_s: 300

  # Low dissolved solids may indicate low oxygen — aerate
  - sensor: tds_ppm
    operator: "<"
    threshold: 50.0
    relay: 3
    action: "on"
    duration_s: 180

  # =================================================================
  # Relay 4 — Circulation pump / flush valve
  # =================================================================

  # Very high TDS: flush/dilute for 2 minutes
  - sensor: tds_ppm
    operator: ">"
    threshold: 2000.0
    relay: 4
    action: "on"
    duration_s: 120

  # TDS back in range: stop flushing
  - sensor: tds_ppm
    operator: "<="
    threshold: 1500.0
    relay: 4
    action: "off"
    duration_s: 0

  # High water temperature: circulate to cool
  - sensor: temp_c
    operator: ">"
    threshold: 35.0
    relay: 4
    action: "on"
    duration_s: 0

  # Temperature back to normal: stop circulation
  - sensor: temp_c
    operator: "<="
    threshold: 30.0
    relay: 4
    action: "off"
    duration_s: 0

  # Extreme turbidity: circulate to prevent stratification
  - sensor: turbidity_ntu
    operator: ">"
    threshold: 1000.0
    relay: 4
    action: "on"
    duration_s: 60

  # =================================================================
  # Safety — Emergency shutoffs
  # =================================================================

  # Very high temperature: shut off all dosing pumps (thermal safety)
  - sensor: temp_c
    operator: ">"
    threshold: 45.0
    relay: 1
    action: "off"
    duration_s: 0

  - sensor: temp_c
    operator: ">"
    threshold: 45.0
    relay: 2
    action: "off"
    duration_s: 0

# ===============================================================
# RELAY CONTROL CHANNELS  (Commercial tier)
# ===============================================================
# Read this before wiring anything.
#
# A dead Pi cannot energise a coil. The only state a crashed, hung, or
# unpowered device can hold is DE-ENERGISED, so that is what "fail-safe"
# always means. What it does physically depends on how you wire the contact:
#
#     contact: NC  ->  de-energised = load RUNNING
#     contact: NO  ->  de-energised = load STOPPED
#
# Therefore ANY channel whose fail_safe_state is "run" MUST be wired NC.
# The firmware rejects run+NO outright, because that fail-safe cannot happen.
# Life-critical loads (aeration, circulation) are called out by name and get a
# clearer error, but the rule applies to every role.
#
# PILOT DUTY. These outputs switch a contactor coil, a 24 V solenoid, or a VFD
# enable input. They never carry a motor or a line-voltage load directly.
# Limits: 5 A @ 30 VDC through NO, 3 A through NC (Omron G5Q-14-DC24).
#
# COMMISSIONED. Every channel ships false and never actuates until the Service
# Window commissioning wizard test-fires it and the operator confirms. Do not
# hand-edit this to true — the wizard logs the test-fire, which is the record
# that the wiring was actually verified.
#
# These channel settings are deliberately NOT remotely configurable. Remote
# config carries only SETTINGS_SCHEMA keys, so a compromised cloud account
# cannot re-declare a contact type, raise a current limit, or commission a
# channel.
# ---------------------------------------------------------------
# channels:
#   - channel: 3
#     role: aeration              # aeration|circulation|dosing|valve|heater|
#                                 # chiller|lighting|auxiliary
#     contact: NC                 # aeration is life-critical -> must be NC
#     fail_safe_state: run        # loss of power leaves the aerator RUNNING
#     load_type: contactor_coil   # contactor_coil|solenoid_24v|vfd_enable|
#                                 # pilot_relay
#     expected_current_a: 0.25    # coil current, not motor current
#     deadband: 15.0              # ORP mV either side of the setpoint
#     min_on_s: 300               # protect the contactor and the motor
#     min_off_s: 300
#     min_interval_s: 60
#     stale_cycles: 3             # 3 x 60 s without a valid reading -> fail-safe
#     commissioned: false         # set by the commissioning wizard only
#
#   - channel: 1
#     role: dosing
#     contact: NO                 # dosing stops on power loss
#     fail_safe_state: stop
#     load_type: solenoid_24v
#     expected_current_a: 0.5
#     deadband: 0.15              # pH units
#     min_on_s: 10
#     min_off_s: 120
#     min_interval_s: 30
#     stale_cycles: 3
#     commissioned: false

channels: []
