# WQM-1 PCBA rev Fin_3 — hardware pin/channel reference
# This file is NOT loaded by firmware (see src/utils/config.py for runtime constants)
i2c:
  bus: 1
  sda: 2
  scl: 3
ads1115:
  address: 0x48
  alert_rdy: 5
  channels:
    tds: 0        # AIN0, VIN0, 0-2.3V (CD4060 + LM324 + D18-D22 clamping)
    turbidity: 1  # AIN1, VIN1, 0-4.5V (LMV321 buffer)
    ph: 2         # AIN2, PH_INP from LMP91200 via R12
    spare: 3      # AIN3, PH_INN (no ORP on Fin_3)
ds18b20:
  gpio: 4
relay:
  pins: [17, 27, 22, 23]
  active: high
led:
  pins: [24, 25, 12, 13]
  active: high
lora:
  spi_bus: 0
  spi_device: 0
  cs: 8
  rst: 18
  busy: 20
  dio1: 16
gps:
  uart: /dev/serial0
  baud: 9600
  extint: 19
fan:
  gpio: 21
