name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-mock pytest-cov responses freezegun flask
          pip install smbus2 pyserial requests pycryptodome pyyaml qrcode

      # Tests marked with @pytest.mark.hardware require physical I2C/GPIO/SPI
      # and are automatically skipped in CI via the -m flag below.
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "not hardware" \
            --cov=src --cov-report=term-missing --cov-fail-under=75

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mypy and stubs
        run: |
          pip install mypy types-requests types-pyserial types-PyYAML
          pip install smbus2 pyserial requests pycryptodome pyyaml flask

      - name: Run mypy
        env:
          PYTHONPATH: src
        run: |
          mypy --version
          cat pyproject.toml
          mypy src/ --config-file pyproject.toml --show-error-codes 2>&1 || {
            echo "::error::mypy failed with exit code $?"
            mypy src/ --config-file pyproject.toml --show-error-codes
          }
