name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # VERSION file == pyproject.toml always; on tag builds the git tag must
      # match both (the release workflow refuses to sign otherwise).
      - name: Check VERSION == pyproject (== tag on tag builds)
        run: |
          FILE_VERSION="$(cat VERSION)"
          PYPROJECT_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "VERSION=$FILE_VERSION pyproject=$PYPROJECT_VERSION ref=$GITHUB_REF"
          if [ "$FILE_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
                echo "::error::Tag ($TAG_VERSION) != VERSION file ($FILE_VERSION)"
                exit 1
              fi
              ;;
          esac

  ota-bundle-roundtrip:
    name: OTA Bundle Round-Trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pycryptodome pyyaml

      # Build the OTA tarball exactly like the release workflow, sign its
      # manifest with an EPHEMERAL test key, then verify the round-trip using
      # the very same code the device runs (src/ota/agent.py helpers).
      - name: Build, sign, and verify OTA bundle
        env:
          PYTHONPATH: src
        run: |
          VERSION=$(cat VERSION)
          tar --exclude='__pycache__' --exclude='*.pyc' \
            -czf "wqm1-firmware-${VERSION}.tar.gz" \
            src config scripts systemd requirements.txt requirements-rpi.txt VERSION setup.sh
          python3 <<'PYEOF'
          import base64, json
          from datetime import UTC, datetime
          from pathlib import Path

          from Crypto.PublicKey import ECC
          from Crypto.Signature import eddsa

          from ota.agent import (
              sha256_file,
              validate_tar_members,
              verify_manifest_signature,
              version_tuple,
          )

          version = Path("VERSION").read_text().strip()
          bundle = Path(f"wqm1-firmware-{version}.tar.gz")

          # Ephemeral signing key — this job proves the pipeline, not the key.
          key = ECC.generate(curve="Ed25519")
          pub_pem = key.public_key().export_key(format="PEM")

          manifest = {
              "product": "wqm1",
              "version": version,
              "channel": "stable",
              "sha256": sha256_file(bundle),
              "sizeBytes": bundle.stat().st_size,
              "minFromVersion": "2.0.0",
              "keyId": "ota-ci-test",
              "createdAt": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "requiresDeps": False,
              "notes": "CI round-trip test",
          }
          manifest_str = json.dumps(manifest, sort_keys=True, separators=(",", ":"))
          signature = eddsa.new(key, "rfc8032").sign(manifest_str.encode("utf-8"))

          # Round-trip: verify with the device-side helpers.
          verify_manifest_signature(manifest_str.encode("utf-8"), signature, pub_pem)
          assert sha256_file(bundle) == manifest["sha256"], "sha256 mismatch"
          tar_error = validate_tar_members(bundle)
          assert tar_error is None, f"tar sanity failed: {tar_error}"
          assert version_tuple(version) is not None, "unparseable version"

          # A tampered signature must be rejected.
          bad = bytearray(signature)
          bad[0] ^= 0xFF
          try:
              verify_manifest_signature(manifest_str.encode("utf-8"), bytes(bad), pub_pem)
          except ValueError:
              pass
          else:
              raise SystemExit("tampered signature was accepted")

          # Base64 encode/decode round-trip (matches the publish payload).
          sig_b64 = base64.b64encode(signature).decode("ascii")
          verify_manifest_signature(
              manifest_str.encode("utf-8"), base64.b64decode(sig_b64), pub_pem
          )
          print(f"OTA bundle round-trip OK for {bundle.name}")
          PYEOF

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-mock pytest-cov flask
          pip install smbus2 pyserial pycryptodome pyyaml qrcode

      # Tests marked with @pytest.mark.hardware require physical I2C/GPIO/SPI
      # and are automatically skipped in CI via the -m flag below.
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "not hardware" \
            --cov=src --cov-report=term-missing --cov-fail-under=75

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mypy and stubs
        run: |
          pip install mypy types-pyserial types-PyYAML
          pip install smbus2 pyserial pycryptodome pyyaml flask

      - name: Run mypy
        env:
          PYTHONPATH: src
        run: mypy src/ --config-file pyproject.toml || echo "::warning::mypy found type errors (non-blocking)"
