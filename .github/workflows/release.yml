name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Package hardware BOM
        run: zip -r hardware-bom.zip hardware/bom/

      - name: Package hardware fab outputs
        run: |
          if [ -d hardware/fab ] && [ "$(ls -A hardware/fab 2>/dev/null)" ]; then
            zip -r hardware-fab.zip hardware/fab/
          else
            echo "No fab outputs found — skipping."
          fi

      - name: Package firmware
        run: |
          VERSION=$(cat VERSION)
          zip -r "firmware-v${VERSION}.zip" \
            src/ config/ scripts/ systemd/ requirements.txt VERSION setup.sh \
            -x "src/__pycache__/*" "src/**/__pycache__/*"

      - name: Generate checksums
        run: sha256sum *.zip > checksums.sha256

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -i requirements.txt -o sbom.json --format json || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            hardware-bom.zip
            hardware-fab.zip
            firmware-v*.zip
            checksums.sha256
            sbom.json
