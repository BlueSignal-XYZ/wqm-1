# Persistent journal, capped. Raspberry Pi OS leaves journald volatile when
# /var/log/journal does not exist, and a volatile journal is empty after a
# power cycle — which is how the setup-hotspot script's failure was lost
# on the Pi Zero W that never raised WQM1-. 32M is enough for a boot and a
# day of firmware logs on a small card; the firmware's own rotating file
# under /var/log/bluesignal stays the long record.
[Journal]
Storage=persistent
SystemMaxUse=32M
SystemMaxFileSize=4M
RuntimeMaxUse=16M
