# Persistent, size-capped journal with a short flush interval.
# Storage=volatile would drop the previous boot on a power cut, which is
# the failure we are trying to diagnose. SyncIntervalSec flushes so a pull
# loses at most one interval. wqm1-journal-preserve copies the on-disk
# journal to /var/lib/wqm1/journal-previous before journald opens it.
# /var/log itself is tmpfs; /var/log/journal is a bind mount of
# /var/lib/wqm1/journal so the capped store is the only log path on the card.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=32M
SystemMaxFileSize=8M
RuntimeMaxUse=8M
SyncIntervalSec=30s
MaxRetentionSec=14day
ForwardToSyslog=no
ForwardToWall=no
